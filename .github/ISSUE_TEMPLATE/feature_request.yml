name: Feature request
description: Proponi una nuova funzionalità.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: value
    attributes:
      label: Obiettivo
      description: Quale problema pratico risolve la funzione?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Comportamento proposto
      description: Descrivi flusso, vincoli, possibili rischi privacy o sicurezza.
