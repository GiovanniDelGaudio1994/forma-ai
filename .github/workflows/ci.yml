name: Demo checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Validate first-party JavaScript
        run: |
          node --check portfolio/assets/site.js
          node --check legacybridge-demo/site.js
          node --check portfolio/assets/theme-init.js
      - name: Verify generated portfolio and security regressions
        run: |
          python3 scripts/build_pages.py
          python3 scripts/audit_portfolio.py
