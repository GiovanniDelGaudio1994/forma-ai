name: Legacy demo deployment (manual only)
# Production GitHub Pages moved to GiovanniDelGaudio1994/giovanni-portfolio.
# Keep this manual workflow only for controlled rollback/legacy preview.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare portfolio homepage and preserve demos
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
